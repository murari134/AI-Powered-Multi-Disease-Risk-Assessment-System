# MediRisk 2.0 — Dataset Registry
# --------------------------------
# Registers all 10 disease datasets for the ML layer.
# Phase 7A: Status = SPECIFICATION_ONLY
# Phase 7B: Status will be updated to GENERATED after synthetic data creation.
#
# This file is the authoritative source of truth for dataset existence.
# Any experiment must reference a dataset_code present in this registry.

registry_version: "1.0.0"
schema_version: "1.0.0"
created: "2026-09-26"
total_diseases: 10
total_record_target: 50000

datasets:

